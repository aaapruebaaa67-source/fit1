body{background:radial-gradient(1200px 600px at 15% -5%,rgba(163,230,53,.10),transparent 60%),radial-gradient(1000px 600px at 100% 0%,rgba(34,211,238,.08),transparent 55%),radial-gradient(900px 700px at 50% 110%,rgba(167,139,250,.08),transparent 60%),#08090d;color:#f1f5f4;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}

.animate-fadein{animation:fadein .28s ease}

const explainReps=s=>{
  let m=s.match(/^(\d+)\s*[×x]\s*(\d+)-(\d+)\s*seg/i);
  if(m)return s+' ('+m[1]+' series de '+m[2]+' a '+m[3]+' segundos)';
  m=s.match(/^(\d+)\s*[×x]\s*AMRAP/i);
  if(m)return s+' ('+m[1]+' series al fallo: las repeticiones que puedas)';
  m=s.match(/^(\d+)\s*[×x]\s*(\d+)-(\d+)/);
  if(m)return s+' ('+m[1]+' series de '+m[2]+' a '+m[3]+' repeticiones)';
  m=s.match(/^(\d+)\s*[×x]\s*(\d+)/);
  if(m)return s+' ('+m[1]+' series de '+m[2]+' repeticiones)';
  return s;
};

    const items=foods.map((f,j)=>{const raw=x[j]*100,gr=raw>=20?Math.round(raw/5)*5:Math.round(raw);return{f,gr}}).filter(it=>it.gr>=5);
    if(veg)items.push({f:veg,gr:150});
    const tot={p:0,c:0,g:0,k:0};items.forEach(({f,gr})=>{tot.k+=f[1]*gr/100;tot.p+=f[2]*gr/100;tot.c+=f[3]*gr/100;tot.g+=f[4]*gr/100});
    let err=0;W.forEach(([w,m])=>{err+=w*(tot[m]-tgt[m])*(tot[m]-tgt[m])});
    const nm=z=>z?z[0]:'';const meat=/Pechuga|Pavo|Ternera|Cerdo|Salmón|Atún|Merluza|Gambas|Huevo|Tofu/,sweet=/Plátano|Manzana|Naranja|Fresas|Arándanos|Kiwi|Miel|Chocolate/,dairy=/Yogur|Queso fresco|Requesón|Leche|whey/;

// Escucha en tiempo real: si los datos cambian en Firestore (p.ej. desde otro
// dispositivo con la misma cuenta), se reflejan aquí solos, sin recargar.
useEffect(()=>{
  if(!USE_FIREBASE||!s.auth)return;
  const db=getDb();if(!db){setCloudStatus('offline');return}
  remoteReady.current=false;remoteScore.current=0;
  const unsub=db.collection('users').doc(s.auth.email).onSnapshot(doc=>{
    if(applyingRemote.current)return;
    const first=!remoteReady.current;
    if(doc.exists){
      const remote=doc.data(),rs=contentScore(remote.appState),ls=contentScore(sRef.current);
      if(remote.appState&&remote.updatedAt&&remote.updatedAt!==lastPushed.current){
        if(first&&ls>3&&rs<ls*0.5){
          // La nube tiene mucho menos que este móvil: NO borramos el móvil; restauramos la nube con estos datos.
          remoteReady.current=true;remoteScore.current=rs;setPushNonce(n=>n+1);setCloudStatus('syncing');return;
        }
        applyingRemote.current=true;
        setS(p=>keepLocalPhotos({...p,...remote.appState,auth:p.auth},p));
        setTimeout(()=>{applyingRemote.current=false},300);
      }
      remoteScore.current=Math.max(remoteScore.current,rs);
    }
    remoteReady.current=true;
    setCloudStatus('synced');
  },()=>setCloudStatus('error'));
  return()=>unsub();
},[USE_FIREBASE&&s.auth&&s.auth.email]);
// Sube los cambios locales a la nube automáticamente, con un pequeño retraso
// (para no escribir en Firestore en cada pulsación, solo cuando el usuario

useEffect(()=>{
  clearTimeout(pushTimer.current);   // SIEMPRE cancelar subidas pendientes (antes podía quedar una subida vieja y vacía en marcha)
  if(!USE_FIREBASE||!s.auth||deleting.current)return;

  if(applyingRemote.current)return;
  if(!remoteReady.current)return;   // no subir nada hasta haber leído primero lo que hay en la nube
  setCloudStatus('syncing');
  pushTimer.current=setTimeout(()=>{
    const cur=sRef.current;if(!cur.auth||deleting.current)return;
    const ls=contentScore(cur);
    if(!window.__fpAllowShrink&&remoteScore.current>3&&ls<remoteScore.current*0.5){setCloudStatus('blocked');return}

  },1500);
},[s,pushNonce]);
